name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: Ghost-Linux
          - os: macos-latest
            artifact_name: Ghost-Mac
          - os: windows-latest
            artifact_name: Ghost-Windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Create venv
        run: python -m venv .venv

      - name: Install deps (Unix)
        if: runner.os != 'Windows'
        run: .venv/bin/pip install -r requirements.txt

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\pip install -r requirements.txt

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: .venv/bin/python compile.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: utf-8
        run: .venv\Scripts\python compile.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
